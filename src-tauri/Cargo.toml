[package]
name = "clicadre"
version = "0.1.1"
description = "Clicadre : capture d'écran, floutage, annotations et fonds élégants"
authors = ["abg5f"]
license = "MIT"
edition = "2021"

[lib]
name = "clicadre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "2.7.0"
xcap = "0.9.8"
arboard = "3.6.1"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
